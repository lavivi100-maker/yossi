name = "yossi"
main = "worker.js"
compatibility_date = "2026-10-01"
routes = [{ pattern = "yossi.ly-systems.co.il", custom_domain = true }]

# The page itself is served straight from public/; only /api/* reaches worker.js
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]
